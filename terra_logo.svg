<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 120 120">
  <g transform="translate(60,60)">
    <line x1="-50" y1="-30" x2="0" y2="0" stroke="#7E5D3F" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="x1" values="-50;-8;-50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="-30;-5;-30" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="50" y1="-30" x2="0" y2="0" stroke="#7E5D3F" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="x1" values="50;8;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="-30;-5;-30" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="-50" y1="30" x2="0" y2="0" stroke="#7E5D3F" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="x1" values="-50;-8;-50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="30;5;30" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="50" y1="30" x2="0" y2="0" stroke="#7E5D3F" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="x1" values="50;8;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="30;5;30" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="-60" y1="0" x2="0" y2="0" stroke="#7E5D3F" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="x1" values="-60;-10;-60" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="0" x2="0" y2="0" stroke="#7E5D3F" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="x1" values="60;10;60" dur="4s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="5" fill="#C9412D">
      <animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>