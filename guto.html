<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>pipos · guto</title>
<meta name="theme-color" content="#f7f1e6">
<link rel="icon" href="onca-icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="onca-icone-180.png">
<style>
  :root{--areia:#f7f1e6;--areia-2:#efe6d6;--cafe:#43302a;--cafe-2:#7e5d3f;--terracota:#c9412d;--linha:#e5d9c6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(90% 60% at 50% 0%,rgba(201,65,45,.07),transparent 60%),var(--areia);color:var(--cafe);-webkit-font-smoothing:antialiased;text-transform:lowercase;min-height:100vh;font-size:15px;line-height:1.45}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0;max-width:560px;margin:0 auto}
  .voltar{display:inline-flex;align-items:center;gap:8px;color:var(--cafe-2);text-decoration:none;font-size:14px;font-weight:600}
  .voltar svg{width:18px;height:18px}
  .marca{font-weight:700;letter-spacing:.14em;font-size:16px}.marca .ponto{color:var(--terracota)}
  main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
  .trava{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12vh;text-align:center}
  .trava img{height:120px}
  .trava input{width:min(100%,300px);padding:14px 18px;border-radius:999px;border:1.5px solid var(--linha);background:#fffdf8;font-size:16px;color:var(--cafe);text-align:center;outline:none;text-transform:none}
  .trava button{padding:13px 26px;border-radius:999px;border:0;background:var(--terracota);color:#fff8f3;font-size:15px;font-weight:600;font-family:inherit}
  .erro{color:var(--terracota);font-size:13px;min-height:18px}
  .topo h1{font-size:34px;letter-spacing:.04em}
  .sub{color:var(--cafe-2);font-size:13px;margin-top:2px}
  .zap{margin-top:12px;width:100%;padding:12px;border-radius:999px;border:1.5px solid #25d366;background:#effbf3;color:#1a7f43;font:600 14px/1 inherit;font-family:inherit}
  .sync{font-size:12px;color:#1a7f43;text-align:center;margin-top:8px}
  .reg{display:flex;gap:6px;margin-top:8px}.reg input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1.5px solid var(--linha);background:var(--areia);font-size:15px;color:var(--cafe);font-family:inherit;outline:none}.reg button{padding:11px 16px;border-radius:999px;border:0;background:var(--terracota);color:#fff8f3;font:600 14px/1 inherit;font-family:inherit}
  .log{list-style:none;padding:0;margin-top:10px;font-size:13.5px}.log li{padding:6px 0;border-bottom:1px solid var(--linha)}
  .abas{display:flex;gap:6px;margin:16px 0 14px;overflow-x:auto}
  .abas button{flex:1;padding:10px 6px;border-radius:999px;border:1.5px solid var(--linha);background:#fffdf8;color:var(--cafe-2);font:600 13px/1 inherit;font-family:inherit;white-space:nowrap}
  .abas button.on{background:var(--terracota);border-color:var(--terracota);color:#fff8f3}
  .aba{display:none}.aba.on{display:block}
  .card{background:#fffdf8;border:1.5px solid var(--linha);border-radius:20px;padding:16px 18px;margin-bottom:12px;box-shadow:0 6px 18px rgba(126,93,63,.07)}
  .card.alerta{border-color:var(--terracota)}
  .card.vazio{opacity:.7}
  h2{font-size:15px;color:var(--terracota);margin-bottom:8px}
  h2.sep{margin-top:14px}
  p{margin:4px 0}
  ul{padding-left:18px}li{margin:3px 0}
  .mini{font-size:12.5px;color:var(--cafe-2)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--linha);white-space:nowrap;text-align:left;vertical-align:top}
  td:last-child,th:last-child{text-align:right}
  table:not(.cols) td:first-child{color:var(--cafe-2);padding-right:12px}
  table:not(.cols) td:last-child{white-space:normal}
  th{font-size:12px;color:var(--cafe-2);font-weight:600}
  .doses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
  .dose{display:flex;align-items:center;gap:6px;background:var(--areia);border:1px solid var(--linha);border-radius:12px;padding:8px 6px;font-size:12.5px;white-space:nowrap;cursor:pointer;user-select:none}
  .dose input{accent-color:var(--terracota);width:17px;height:17px}
  .dose.ok{background:#f3dcc9;border-color:#d9b08f}.dose.ok span{text-decoration:line-through;opacity:.65}
  .prox{font-size:13px;color:var(--cafe-2);margin-top:8px}.prox b{color:var(--terracota)}
</style>
</head>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(senha){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
}
async function tentar(senha,lembrar){
  try{const h=await abrir(senha);document.getElementById('app').innerHTML=h;if(lembrar)try{localStorage.setItem('pipos_guto',senha)}catch(e){}iniciar();return true}catch(e){return false}
}
document.getElementById('trava').onsubmit=async e=>{e.preventDefault();const ok=await tentar(document.getElementById('senha').value,true);if(!ok)document.getElementById('erro').textContent='senha errada'};
(async()=>{let s=null;try{s=localStorage.getItem('pipos_guto')}catch(e){}if(s&&!(await tentar(s,false)))try{localStorage.removeItem('pipos_guto')}catch(e){}})();

function iniciar(){
  document.querySelectorAll('.abas button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.abas button,.aba').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.aba).classList.add('on')});
  const nasc=new Date(2023,11,1),hoje=new Date();let m=(hoje.getFullYear()-nasc.getFullYear())*12+hoje.getMonth()-nasc.getMonth();if(hoje.getDate()<nasc.getDate())m--;
  document.getElementById('idade').textContent=Math.floor(m/12)+' anos e '+(m%12)+' meses';
  const dias=['dom','seg','ter','qua','qui','sex','sáb'];
  const HA='https://terra.pipos.online',CID=location.origin+'/',RED=location.origin+location.pathname,ENT='todo.guto';
  const sync=t=>document.getElementById('sync').textContent=t;
  let itens=[],ws=null,seq=1;const esperas={};
  const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

  async function tokenPost(dados){const r=await fetch(HA+'/auth/token',{method:'POST',body:new URLSearchParams({...dados,client_id:CID})});if(!r.ok)throw new Error('auth '+r.status);const j=await r.json();j.expira=Date.now()+j.expires_in*1000-60000;return j}
  async function token(){
    const q=new URLSearchParams(location.search);
    if(q.get('code')){const t=await tokenPost({grant_type:'authorization_code',code:q.get('code')});ls.set('pipos_ha',t);history.replaceState(null,'',RED);return t.access_token}
    let t=ls.get('pipos_ha');
    if(!t||!t.refresh_token){entrarHA();return null}
    if(Date.now()>t.expira){try{const n=await tokenPost({grant_type:'refresh_token',refresh_token:t.refresh_token});t={...t,...n};ls.set('pipos_ha',t)}catch(e){localStorage.removeItem('pipos_ha');entrarHA();return null}}
    return t.access_token;
  }
  function entrarHA(){sync('fazendo login no terra…');location.href=HA+'/auth/authorize?response_type=code&client_id='+encodeURIComponent(CID)+'&redirect_uri='+encodeURIComponent(RED)+'&state=guto'}
  function enviar(msg){return new Promise((ok,erro)=>{const id=seq++;esperas[id]={ok,erro};ws.send(JSON.stringify({...msg,id}))})}
  async function conectar(){
    const tk=await token();if(!tk)return;
    ws=new WebSocket(HA.replace('https','wss')+'/api/websocket');
    ws.onmessage=async e=>{const d=JSON.parse(e.data);
      if(d.type==='auth_required')ws.send(JSON.stringify({type:'auth',access_token:tk}));
      else if(d.type==='auth_ok'){sync('sincronizado com a gabi e o ric');enviar({type:'todo/item/subscribe',entity_id:ENT})}
      else if(d.type==='auth_invalid'){localStorage.removeItem('pipos_ha');entrarHA()}
      else if(d.type==='event'&&d.event&&d.event.items){itens=d.event.items;render()}
      else if(d.type==='result'&&esperas[d.id]){d.success?esperas[d.id].ok(d.result):esperas[d.id].erro(d.error);delete esperas[d.id]}};
    ws.onclose=()=>{sync('reconectando…');setTimeout(conectar,3000)};
  }
  const servico=(acao,dados)=>enviar({type:'call_service',domain:'todo',service:acao,service_data:dados,target:{entity_id:ENT}});

  const RX=/^(tylenol|ciloxan|ibuprofeno) (\d\d)\/(\d\d) (\d\d)h(\d\d)?$/;
  const doses=g=>itens.map(i=>{const r=RX.exec(i.summary);return r&&r[1]===g?{i,dt:new Date(2026,+r[3]-1,+r[2],+r[4],+(r[5]||0)),feito:i.status==='completed'}:null}).filter(Boolean).sort((a,b)=>a.dt-b.dt);
  const hh=d=>String(d.getHours()).padStart(2,'0')+'h'+(d.getMinutes()?String(d.getMinutes()).padStart(2,'0'):'');
  const quando=d=>dias[d.getDay()]+' '+hh(d);
  function render(){
    const agora=new Date();
    for(const [g,nome] of [['ty','tylenol'],['ci','ciloxan']]){
      const box=document.querySelector('[data-grupo="'+g+'"]');box.innerHTML='';let prox=null;
      for(const x of doses(nome)){const el=document.createElement('label');el.className='dose'+(x.feito?' ok':'');
        el.innerHTML='<input type="checkbox"'+(x.feito?' checked':'')+'><span>'+quando(x.dt)+'</span>';
        el.querySelector('input').onchange=e=>{el.classList.toggle('ok',e.target.checked);servico('update_item',{item:x.i.summary,status:e.target.checked?'completed':'needs_action'}).catch(()=>sync('não salvou, tente de novo'))};
        box.appendChild(el);if(!x.feito&&!prox)prox=x.dt}
      const p=document.getElementById('prox-'+g);
      if(!itens.length){p.textContent='';continue}
      if(!prox){p.textContent='todas as doses fixas feitas';continue}
      const min=Math.round((prox-agora)/60000);
      p.innerHTML=min<0?'próxima: <b>'+quando(prox)+'</b> (atrasada)':'próxima: <b>'+quando(prox)+'</b> · em '+(min>=60?Math.floor(min/60)+'h'+String(min%60).padStart(2,'0'):min+' min');
    }
    {const box=document.querySelector('[data-grupo="ib"]');const d=doses('ibuprofeno').filter(x=>x.feito);
      box.innerHTML=d.map(x=>'<label class="dose ok"><span>'+quando(x.dt)+'</span></label>').join('');
      const p=document.getElementById('prox-ib');
      if(!d.length)p.textContent='nenhuma dose dada';
      else{const lib=new Date(d[d.length-1].dt.getTime()+6*3600000);p.innerHTML=lib>agora?'próxima liberada a partir de <b>'+quando(lib)+'</b>':'liberado, se tiver dor'}}
    const log=itens.filter(i=>/^(temperatura|nota) /.test(i.summary)).slice().reverse();
    document.getElementById('log').innerHTML=log.length?log.map(i=>'<li>'+i.summary.replace(/[<>&]/g,'')+'</li>').join(''):'<li class="mini">nada anotado ainda</li>';
  }
  const carimbo=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+hh(d).replace(/h$/,'h00')};
  document.getElementById('addtemp').onclick=()=>{const v=document.getElementById('temp').value.trim();if(!v)return;servico('add_item',{item:'temperatura '+v.replace('.',',')+' °c · '+carimbo()}).then(()=>document.getElementById('temp').value='')};
  document.getElementById('addnota').onclick=()=>{const v=document.getElementById('nota').value.trim();if(!v)return;servico('add_item',{item:'nota '+v.toLowerCase()+' · '+carimbo()}).then(()=>document.getElementById('nota').value='')};
  document.getElementById('addib').onclick=()=>{const d=new Date(),s='ibuprofeno '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0');
    servico('add_item',{item:s}).then(()=>servico('update_item',{item:s,status:'completed'})).catch(()=>sync('não salvou, tente de novo'))};
  setInterval(render,60000);conectar();

  document.getElementById('zap').onclick=()=>{
    const res=n=>{const d=doses(n).filter(x=>x.feito);return d.length+' doses dadas, última '+(d.length?quando(d[d.length-1].dt):'nenhuma')};
    const temps=itens.filter(i=>/^temperatura /.test(i.summary)).slice(-5).map(i=>'- '+i.summary.replace(/^temperatura /,''));
    const notas=itens.filter(i=>/^nota /.test(i.summary)).slice(-5).map(i=>'- '+i.summary.replace(/^nota /,''));
    const t=['*resumo do guto* (augusto laffitte pizzichini)',
      'nascimento 01/12/2023 · '+document.getElementById('idade').textContent+' · 15 kg · 102 cm','convênio unimed curitiba','',
      '*cirurgia 07/11/2026* (hpp, dr rodrigo pereira)','adenoidectomia, amigdalectomia e tubos de ventilação bilaterais','',
      '*medicação em casa*','- tylenol bebê 2 mL (100 mg/mL) a cada 6h: '+res('tylenol'),'- ibuprofeno 100 mg/mL 15 gotas, só se dor: '+res('ibuprofeno'),'- ciloxan 3 gotas em cada ouvido a cada 8h: '+res('ciloxan'),'- alivium no hospital às 14h00 de 07/11',
      ...(temps.length?['','*temperaturas*',...temps]:[]),...(notas.length?['','*observações*',...notas]:[]),'',
      '*exames*','- audiometria 13/10/2026: perda condutiva leve bilateral, timpanometria c (od) e ar (oe)','- sangue 31/10/2026: hemograma e coagulação normais; ferritina 33,6 e vitamina d 30 (normais, em queda desde jan/25)'].join('\n');
    location.href='https://wa.me/?text='+encodeURIComponent(t);
  };
}
