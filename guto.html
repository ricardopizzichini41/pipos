<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>pipos · guto</title>
<meta name="theme-color" content="#f7f1e6">
<link rel="icon" href="onca-icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="onca-icone-180.png">
<style>
  :root{--areia:#f7f1e6;--areia-2:#efe6d6;--cafe:#43302a;--cafe-2:#7e5d3f;--terracota:#c9412d;--linha:#e5d9c6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(90% 60% at 50% 0%,rgba(201,65,45,.07),transparent 60%),var(--areia);color:var(--cafe);-webkit-font-smoothing:antialiased;text-transform:lowercase;min-height:100vh;font-size:15px;line-height:1.45}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0;max-width:560px;margin:0 auto}
  .voltar{display:inline-flex;align-items:center;gap:8px;color:var(--cafe-2);text-decoration:none;font-size:14px;font-weight:600}
  .voltar svg{width:18px;height:18px}
  .marca{font-weight:700;letter-spacing:.14em;font-size:16px}.marca .ponto{color:var(--terracota)}
  main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
  .trava{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12vh;text-align:center}
  .trava img{height:120px}
  .trava input{width:min(100%,300px);padding:14px 18px;border-radius:999px;border:1.5px solid var(--linha);background:#fffdf8;font-size:16px;color:var(--cafe);text-align:center;outline:none;text-transform:none}
  .trava button{padding:13px 26px;border-radius:999px;border:0;background:var(--terracota);color:#fff8f3;font-size:15px;font-weight:600;font-family:inherit}
  .erro{color:var(--terracota);font-size:13px;min-height:18px}
  .topo h1{font-size:34px;letter-spacing:.04em}
  .sub{color:var(--cafe-2);font-size:13px;margin-top:2px}
  .zap{margin-top:12px;width:100%;padding:12px;border-radius:999px;border:1.5px solid #25d366;background:#effbf3;color:#1a7f43;font:600 14px/1 inherit;font-family:inherit}
  .abas{display:flex;gap:6px;margin:16px 0 14px;overflow-x:auto}
  .abas button{flex:1;padding:10px 6px;border-radius:999px;border:1.5px solid var(--linha);background:#fffdf8;color:var(--cafe-2);font:600 13px/1 inherit;font-family:inherit;white-space:nowrap}
  .abas button.on{background:var(--terracota);border-color:var(--terracota);color:#fff8f3}
  .aba{display:none}.aba.on{display:block}
  .card{background:#fffdf8;border:1.5px solid var(--linha);border-radius:20px;padding:16px 18px;margin-bottom:12px;box-shadow:0 6px 18px rgba(126,93,63,.07)}
  .card.alerta{border-color:var(--terracota)}
  .card.vazio{opacity:.7}
  h2{font-size:15px;color:var(--terracota);margin-bottom:8px}
  h2.sep{margin-top:14px}
  p{margin:4px 0}
  ul{padding-left:18px}li{margin:3px 0}
  .mini{font-size:12.5px;color:var(--cafe-2)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--linha);white-space:nowrap;text-align:left;vertical-align:top}
  td:last-child,th:last-child{text-align:right}
  table:not(.cols) td:first-child{color:var(--cafe-2);padding-right:12px}
  table:not(.cols) td:last-child{white-space:normal}
  th{font-size:12px;color:var(--cafe-2);font-weight:600}
  .doses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
  .dose{display:flex;align-items:center;gap:6px;background:var(--areia);border:1px solid var(--linha);border-radius:12px;padding:8px 6px;font-size:12.5px;white-space:nowrap;cursor:pointer;user-select:none}
  .dose input{accent-color:var(--terracota);width:17px;height:17px}
  .dose.ok{background:#f3dcc9;border-color:#d9b08f}.dose.ok span{text-decoration:line-through;opacity:.65}
  .prox{font-size:13px;color:var(--cafe-2);margin-top:8px}.prox b{color:var(--terracota)}
</style>
</head>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(senha){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
}
async function tentar(senha,lembrar){
  try{const h=await abrir(senha);document.getElementById('app').innerHTML=h;if(lembrar)try{localStorage.setItem('pipos_guto',senha)}catch(e){}iniciar();return true}catch(e){return false}
}
document.getElementById('trava').onsubmit=async e=>{e.preventDefault();const ok=await tentar(document.getElementById('senha').value,true);if(!ok)document.getElementById('erro').textContent='senha errada'};
(async()=>{let s=null;try{s=localStorage.getItem('pipos_guto')}catch(e){}if(s&&!(await tentar(s,false)))try{localStorage.removeItem('pipos_guto')}catch(e){}})();

function iniciar(){
  document.querySelectorAll('.abas button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.abas button,.aba').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.aba).classList.add('on')});
  const nasc=new Date(2023,11,1),hoje=new Date();let m=(hoje.getFullYear()-nasc.getFullYear())*12+hoje.getMonth()-nasc.getMonth();if(hoje.getDate()<nasc.getDate())m--;
  document.getElementById('idade').textContent=Math.floor(m/12)+' anos e '+(m%12)+' meses';
  const A=2026,M=10,dias=['dom','seg','ter','qua','qui','sex','sáb'];
  const G={ty:[[7,18,30],[8,0,30],[8,6,30],[8,12,30],[8,18,30],[9,0,30],[9,6,30],[9,12,30],[9,18,30],[10,0,30],[10,6,30],[10,12,30]],
           ci:[[7,18,0],[8,2,0],[8,10,0],[8,18,0],[9,2,0],[9,10,0],[9,18,0],[10,2,0],[10,10,0]]};
  const pre={'ty-7-18':true,'ci-7-18':true};
  let st={};try{st=JSON.parse(localStorage.getItem('pipos_guto_doses')||'null')||pre}catch(e){st=pre}
  const salvar=()=>{try{localStorage.setItem('pipos_guto_doses',JSON.stringify(st))}catch(e){}};
  const hh=(h,mi)=>String(h).padStart(2,'0')+'h'+(mi?String(mi).padStart(2,'0'):'');
  function render(){
    const agora=new Date();
    for(const g in G){
      const box=document.querySelector('[data-grupo="'+g+'"]');if(!box)continue;box.innerHTML='';let prox=null;
      G[g].forEach(([d,h,mi])=>{const k=g+'-'+d+'-'+h,dt=new Date(A,M,d,h,mi);
        const el=document.createElement('label');el.className='dose'+(st[k]?' ok':'');
        el.innerHTML='<input type="checkbox"'+(st[k]?' checked':'')+'><span>'+dias[dt.getDay()]+' '+hh(h,mi)+'</span>';
        el.querySelector('input').onchange=e=>{st[k]=e.target.checked;salvar();render()};box.appendChild(el);
        if(!st[k]&&!prox)prox=dt;});
      const p=document.getElementById('prox-'+g);
      if(!prox){p.textContent='todas as doses fixas feitas';continue}
      const min=Math.round((prox-agora)/60000),q=dias[prox.getDay()]+' '+hh(prox.getHours(),prox.getMinutes());
      p.innerHTML=min<0?'próxima: <b>'+q+'</b> (atrasada)':'próxima: <b>'+q+'</b> · em '+(min>=60?Math.floor(min/60)+'h'+String(min%60).padStart(2,'0'):min+' min');
    }
  }
  render();setInterval(render,60000);
  document.getElementById('zap').onclick=()=>{
    const feitas=g=>G[g].filter(([d,h])=>st[g+'-'+d+'-'+h]).map(([d,h,mi])=>dias[new Date(A,M,d,h,mi).getDay()]+' '+hh(h,mi));
    const ult=a=>a.length?a[a.length-1]:'nenhuma';
    const ty=feitas('ty'),ci=feitas('ci');
    const t=['*resumo do guto* (augusto laffitte pizzichini)',
      'nascimento 01/12/2023 · '+document.getElementById('idade').textContent+' · 15 kg · 102 cm',
      'convênio unimed curitiba',
      '',
      '*cirurgia 07/11/2026* (hpp, dr rodrigo pereira)',
      'adenoidectomia, amigdalectomia e tubos de ventilação bilaterais',
      '',
      '*medicação em casa*',
      '- tylenol bebê 2 mL (100 mg/mL) a cada 6h: '+ty.length+' doses dadas, última '+ult(ty),
      '- ciloxan 3 gotas em cada ouvido a cada 8h: '+ci.length+' doses dadas, última '+ult(ci),
      '- alivium no hospital às 14h00 de 07/11',
      '',
      '*exames*',
      '- audiometria 13/10/2026: perda condutiva leve bilateral, timpanometria c (od) e ar (oe)',
      '- sangue 31/10/2026: hemograma e coagulação normais; ferritina 33,6 e vitamina d 30 (normais, em queda desde jan/25)'
    ].join('\n');
    location.href='https://wa.me/?text='+encodeURIComponent(t);
  };
}
</script>
