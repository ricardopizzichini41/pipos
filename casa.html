<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">

<title>pipos · casa</title>

<link rel="icon" href="onca-icone-192.png" sizes="192x192" type="image/png">

<style>
  :root{
    --areia:#f7f1e6; --areia-2:#efe6d6; --cafe:#43302a; --cafe-2:#7e5d3f;
    --terracota:#c9412d; --terracota-2:#bc4f26; --linha:#e5d9c6; --bordo:#7a2e35;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(90% 60% at 50% 0%, rgba(201,65,45,.07), transparent 60%),
      var(--areia);
    color:var(--cafe); display:flex; flex-direction:column; min-height:100%;
    -webkit-font-smoothing:antialiased; text-transform:lowercase;
  }
  header{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 0}
  .voltar{display:inline-flex; align-items:center; gap:8px; color:var(--cafe-2); text-decoration:none; font-size:14px; font-weight:600}
  .voltar svg{width:18px;height:18px}
  .marca{font-weight:700; letter-spacing:.14em; color:var(--cafe); font-size:16px}
  .marca .ponto{color:var(--terracota)}
  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 20px 32px; gap:18px}
  .onca{height:min(34vw,150px); width:auto; filter:drop-shadow(0 10px 24px rgba(126,93,63,.18)); animation:respira 4s ease-in-out infinite}
  @keyframes respira{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.035)}}
  h1{font-size:clamp(26px,6vw,36px); font-weight:700; letter-spacing:.04em; margin-bottom:6px}
  .opcoes{display:grid; gap:14px; width:min(100%,440px)}
  .opcao{display:flex; align-items:center; gap:16px; padding:18px 20px; border-radius:22px; text-decoration:none; color:var(--cafe); background:#fffdf8; border:1.5px solid var(--linha); box-shadow:0 8px 22px rgba(126,93,63,.10); transition:transform .15s ease, box-shadow .15s ease}
  .opcao:hover{box-shadow:0 12px 28px rgba(126,93,63,.16)}
  .opcao:active{transform:scale(.98)}
  .icone{width:52px; height:52px; border-radius:16px; display:grid; place-items:center; flex:0 0 52px; background:var(--areia-2)}
  .icone svg{width:26px; height:26px}
  .opcao.automacao .icone{background:rgba(201,65,45,.12); color:var(--terracota)}
  .opcao.cameras .icone{background:rgba(122,46,53,.10); color:var(--bordo)}
  .opcao.central .icone{background:rgba(126,93,63,.12); color:var(--cafe-2)}
  .texto{display:flex; flex-direction:column; gap:3px; min-width:0}
  .texto b{font-size:17px; font-weight:700}
  .texto span{font-size:13px; color:var(--cafe-2)}
  .seta{margin-left:auto; color:#b9ab96; flex:0 0 auto}
  .seta svg{width:18px;height:18px}
  footer{padding:14px 24px 26px; text-align:center; font-size:12px; color:#a89c8a; letter-spacing:.08em}
</style>
</head>

<header>
  <a class="voltar" href="index.html">

</header>
<main>

      <div class="texto"><b>automação</b><span>luzes, cenas e som do terra</span></div>
      <div class="seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </a>
    <a class="opcao cameras" href="https://terra.pipos.online/dashboard-terra/cameras">
      <div class="icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
      <div class="texto"><b>câmeras</b><span>corredor, piscina, casinha e lavanderia</span></div>
      <div class="seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </a>
    <a class="opcao central" href="prototipo-central.html">

      <div class="texto"><b>central</b><span>viagens, listas, comer — em construção</span></div>
      <div class="seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </a>
  </div>
</main>
<footer>pipos.online</footer>
</body>
</html>
